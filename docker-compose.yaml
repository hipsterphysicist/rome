services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfiles/Dockerfile.local
    command: ["yarn", "run", "dev"]
    ports:
      - "5173:5173"
    volumes:
      - "./app:/usr/src/app"
      - "/usr/src/app/node_modules"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfiles/Dockerfile.local
    command: ["yarn", "run", "docker"]
    ports:
      - "3000:3000"
    volumes:
      - "./server:/usr/src/server"
      - "/usr/src/server/node_modules"
